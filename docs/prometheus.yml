global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: warmdesk
    # The metrics endpoint requires a user with the "metrics" or "admin" global
    # role. Create a dedicated user in Admin → Users, set the role to "metrics",
    # then generate an API key via Admin → Users → (click user) → API Keys.
    #
    # WarmDesk accepts the key via Authorization: ApiKey <key>.
    # Do NOT use bearer_token or basic_auth — those target the JWT / password
    # auth paths and will return 401.
    authorization:
      type: ApiKey
      credentials: <your-api-key>

    # Replace with your WarmDesk base URL. For HTTP deployments change the
    # scheme to "http".
    scheme: https
    static_configs:
      - targets:
          - warmdesk.example.com

    metrics_path: /api/v1/metrics

    # Optional: label every scraped metric with the environment name so you
    # can run multiple WarmDesk instances in the same Prometheus.
    relabel_configs:
      - target_label: instance
        replacement: warmdesk-prod
