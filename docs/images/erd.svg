  <line x1="680" y1="233" x2="590" y2="310" stroke="#c084fc" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowD)"/>
  <text x="622" y="263" class="rel-label">M:N</text>

  <!-- 13. cards → labels (M:N via card_labels, horizontal) -->
  <line x1="595" y1="344" x2="620" y2="344" stroke="#c084fc" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowD)"/>
