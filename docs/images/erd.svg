  <line x1="575" y1="378" x2="655" y2="445" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="588" y="415" class="rel-label">1:N</text>

  <!-- 15. cards → card_checklist_items (1:N, down) -->
  <line x1="465" y1="378" x2="465" y2="445" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="470" y="415" class="rel-label">1:N</text>

