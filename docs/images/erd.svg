  <!-- ══════════════════════════════════════════════
       RELATIONSHIPS
       Solid line = 1:N   Dashed = M:N
  ══════════════════════════════════════════════ -->

  <!-- 1. users → api_keys (1:N, down) -->
  <line x1="107" y1="108" x2="107" y2="165" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="112" y="140" class="rel-label">1:N</text>

  <!-- 2. users → projects (M:N via project_members, horizontal) -->
  <line x1="195" y1="55" x2="420" y2="55" stroke="#c084fc" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowD)"/>
  <text x="285" y="50" class="rel-label">M:N (project_members)</text>

  <!-- 3. users → conversations (1:N, long down) -->
  <line x1="60" y1="108" x2="60" y2="310" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="65" y="215" class="rel-label">M:N</text>

  <!-- 4. customers → projects (N:1, horizontal) -->
  <line x1="395" y1="74" x2="420" y2="74" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="393" y="70" text-anchor="end" class="rel-label">N:1</text>

  <!-- 5. customers → contracts (1:N, down) -->
  <line x1="307" y1="108" x2="307" y2="165" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="312" y="140" class="rel-label">1:N</text>

