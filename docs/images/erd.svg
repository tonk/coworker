  <line x1="270" y1="108" x2="270" y2="310" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="238" y="215" class="rel-label">1:N</text>

  <!-- 7. projects → columns (1:N, down) -->
  <line x1="507" y1="108" x2="507" y2="165" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="512" y="140" class="rel-label">1:N</text>

  <!-- 8. projects → sprints (1:N, elbow right-down) -->
  <polyline points="595,65 640,65 640,165" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="617" y="105" class="rel-label">1:N</text>

  <!-- 9. projects → topics (1:N, elbow right-down) -->
  <polyline points="595,78 795,78 795,165 820,165" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowN)"/>
  <text x="700" y="73" class="rel-label">1:N</text>

  <!-- 10. projects → time_entries (1:N, down diagonal) -->
