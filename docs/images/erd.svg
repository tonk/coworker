<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 570" width="1050" height="570">
  <defs>
    <marker id="arrowN" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
    <marker id="arrowD" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#c084fc"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .entity-name { font-size: 12px; font-weight: 700; fill: white; }
      .entity-field { font-size: 9.5px; fill: #475569; }
      .rel-label { font-size: 9px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1050" height="570" fill="#f8fafc" rx="4"/>

  <!-- ═══════════════ TITLE ═══════════════ -->
  <text x="525" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">WarmDesk — Core Data Model</text>

  <!-- ══════════════════════════════════════════════
       ENTITY BOX HELPER (x=left, y=top, w=175, h=68)
       Header h=24, divider, fields below
  ══════════════════════════════════════════════ -->

  <!-- ─── USERS (blue) ─── x=20, y=40 -->
