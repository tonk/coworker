name: Build client Linux (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Stamp version in tauri.conf.json
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          node -e "
            const fs = require('fs');
            const p = 'frontend/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          " VERSION="$VERSION"

      - name: Build
        # NO_STRIP=true: linuxdeploy's bundled strip is too old for newer glibc.
        run: cd frontend && NO_STRIP=true npm run tauri:build -- --bundles appimage

      - name: Bundle GStreamer plugins into AppImage
        # Tauri's linuxdeploy integration doesn't reliably invoke the
        # linuxdeploy-plugin-gstreamer plugin.  Instead we post-process:
        # extract the AppImage, copy ubuntu-24.04's GStreamer plugins (ABI-
        # compatible with the bundled webkit2gtk GStreamer core) directly into
        # usr/lib/gstreamer-1.0/, then repack.  At runtime lib.rs sets
        # GST_PLUGIN_PATH to that directory so GStreamer finds the bundled
        # plugins instead of falling back to the system path (e.g. Fedora's
        # incompatible GStreamer 1.26 in /usr/lib64/).
        run: |
          set -euo pipefail
          APPIMAGE=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          echo "Bundling GStreamer into: $APPIMAGE"

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract   # → squashfs-root/ in CWD

          GST_SRC="/usr/lib/x86_64-linux-gnu/gstreamer-1.0"
          GST_DST="squashfs-root/usr/lib/gstreamer-1.0"
          mkdir -p "$GST_DST/gstreamer-1.0"
          cp "$GST_SRC"/lib*.so "$GST_DST/"
          echo "Bundled $(ls "$GST_DST"/lib*.so | wc -l) GStreamer plugins"

          # gst-plugin-scanner moved to /usr/libexec on Ubuntu 24.04; search both locations
          GST_SCANNER=$(find /usr/lib/x86_64-linux-gnu/gstreamer-1.0 /usr/libexec/gstreamer-1.0 \
            -name 'gst-plugin-scanner' 2>/dev/null | head -1)
          if [ -n "$GST_SCANNER" ]; then
            cp "$GST_SCANNER" "$GST_DST/gstreamer-1.0/"
            echo "Bundled gst-plugin-scanner from $GST_SCANNER"
          else
            echo "Warning: gst-plugin-scanner not found — GStreamer plugin scanning may fall back to in-process"
          fi

          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool squashfs-root "$APPIMAGE"
          rm -rf squashfs-root

      - name: Collect artifact
        run: |
          SHA=$(git rev-parse --short HEAD)
          SRC=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cp "$SRC" "WarmDesk-dev-${SHA}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarmDesk-linux
          path: WarmDesk-dev-*-x86_64.AppImage
