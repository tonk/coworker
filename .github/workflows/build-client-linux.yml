name: Build client Linux (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio

      - name: Download linuxdeploy-plugin-gstreamer
        run: |
          curl -fsSL -o /tmp/linuxdeploy-plugin-gstreamer \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh"
          chmod +x /tmp/linuxdeploy-plugin-gstreamer

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Stamp version in tauri.conf.json
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          node -e "
            const fs = require('fs');
            const p = 'frontend/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          " VERSION="$VERSION"

      - name: Build
        # NO_STRIP=true: linuxdeploy's bundled strip is too old for newer glibc.
        # PATH includes /tmp so linuxdeploy discovers linuxdeploy-plugin-gstreamer
        # and bundles the GStreamer plugins needed for camera/mic (appsink, v4l2src,
        # pulsesrc).  Without this the AppImage ships no GStreamer plugins and
        # getUserMedia returns empty device lists on all non-Ubuntu distros.
        run: cd frontend && NO_STRIP=true PATH="$PATH:/tmp" npm run tauri:build -- --bundles appimage

      - name: Collect artifact
        run: |
          SHA=$(git rev-parse --short HEAD)
          SRC=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cp "$SRC" "WarmDesk-dev-${SHA}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarmDesk-linux
          path: WarmDesk-dev-*-x86_64.AppImage
