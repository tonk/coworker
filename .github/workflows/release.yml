name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # required by SignPath to verify OIDC build identity
  actions: read     # required by SignPath to read workflow artifact metadata

jobs:
  # ── Create draft release first ───────────────────────────────────────────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  # ── Server binary + web frontend tarball ────────────────────────────────────
  release-server:
    name: Build server binary
    runs-on: ubuntu-latest
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Embed frontend into binary
        run: |
          mkdir -p backend/staticweb/files
          cp -r frontend/dist/. backend/staticweb/files/

      - name: Build backend (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist-amd64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../dist-amd64/warmdesk .
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-training ./cmd/training

      - name: Build backend (linux/arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist-arm64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../dist-arm64/warmdesk .
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-training ./cmd/training

      - name: Assemble distributions
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p dist-${ARCH}
            cp warmdesk.yaml.example dist-${ARCH}/warmdesk.yaml.example
            cp warmdesk-migrate.yaml.example dist-${ARCH}/warmdesk-migrate.yaml.example
            cp -r deploy dist-${ARCH}/deploy
            cp INSTALL.md dist-${ARCH}/INSTALL.md
            cp README.md dist-${ARCH}/README.md
            cp -r docs dist-${ARCH}/docs
          done

      - name: Create archives
        run: |
          tar -czf warmdesk-${{ github.ref_name }}-linux-amd64.tar.gz -C dist-amd64 .
          tar -czf warmdesk-${{ github.ref_name }}-linux-arm64.tar.gz -C dist-arm64 .

      - name: Sign archives
        if: env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          for f in warmdesk-${{ github.ref_name }}-linux-amd64.tar.gz \
                   warmdesk-${{ github.ref_name }}-linux-arm64.tar.gz; do
            gpg --batch --yes --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            warmdesk-${{ github.ref_name }}-linux-amd64.tar.gz
            warmdesk-${{ github.ref_name }}-linux-amd64.tar.gz.asc
            warmdesk-${{ github.ref_name }}-linux-arm64.tar.gz
            warmdesk-${{ github.ref_name }}-linux-arm64.tar.gz.asc

  # ── Tauri desktop clients ────────────────────────────────────────────────────
  release-desktop:
    name: Build desktop client (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundle: appimage
            artifact: "WarmDesk-*-x86_64.AppImage"
            rename: "WarmDesk-${{ github.ref_name }}-x86_64.AppImage"

          - name: macOS
            os: macos-latest
            bundle: dmg
            artifact: "WarmDesk_*.dmg"
            rename: "WarmDesk-${{ github.ref_name }}-universal.dmg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Stamp version in tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.VERSION.replace(/^v/, '');
            const ver = raw.split('.').slice(0, 3).join('.');
            const tp = 'frontend/src-tauri/tauri.conf.json';
            const tc = JSON.parse(fs.readFileSync(tp, 'utf8'));
            tc.version = ver;
            fs.writeFileSync(tp, JSON.stringify(tc, null, 2) + '\n');
            const cp = 'frontend/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cp, 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"' + ver + '\"');
            fs.writeFileSync(cp, cargo);
          "
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build desktop app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        # NO_STRIP=true: linuxdeploy's bundled strip is too old for newer glibc.
        # The Rust release profile already strips the binary.
        run: cd frontend && NO_STRIP=true npm run tauri:build -- --bundles appimage,deb,rpm

      - name: Build desktop app (macOS universal)
        if: matrix.os == 'macos-latest'
        # Build a universal binary covering both Intel and Apple Silicon.
        run: cd frontend && npm run tauri:build -- --bundles dmg --target universal-apple-darwin

      - name: Collect and rename artifact (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          SRC=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cp "$SRC" "WarmDesk-${{ github.ref_name }}-x86_64.AppImage"
          SRC=$(ls frontend/src-tauri/target/release/bundle/deb/*.deb | head -1)
          cp "$SRC" "WarmDesk-${{ github.ref_name }}-amd64.deb"
          SRC=$(ls frontend/src-tauri/target/release/bundle/rpm/*.rpm | head -1)
          cp "$SRC" "WarmDesk-${{ github.ref_name }}-x86_64.rpm"

      - name: Collect and rename artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          SRC=$(ls frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$SRC" "WarmDesk-${{ github.ref_name }}-universal.dmg"

      - name: Sign artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04' && env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          for f in WarmDesk-${{ github.ref_name }}-x86_64.AppImage \
                   WarmDesk-${{ github.ref_name }}-amd64.deb \
                   WarmDesk-${{ github.ref_name }}-x86_64.rpm; do
            gpg --batch --yes --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      - name: Sign artifact (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          gpg --batch --yes --detach-sign --armor --local-user "$GPG_KEY_ID" \
            WarmDesk-${{ github.ref_name }}-universal.dmg

      - name: Upload to GitHub Release (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            WarmDesk-${{ github.ref_name }}-x86_64.AppImage
            WarmDesk-${{ github.ref_name }}-x86_64.AppImage.asc
            WarmDesk-${{ github.ref_name }}-amd64.deb
            WarmDesk-${{ github.ref_name }}-amd64.deb.asc
            WarmDesk-${{ github.ref_name }}-x86_64.rpm
            WarmDesk-${{ github.ref_name }}-x86_64.rpm.asc

      - name: Upload to GitHub Release (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            WarmDesk-${{ github.ref_name }}-universal.dmg
            WarmDesk-${{ github.ref_name }}-universal.dmg.asc

  # ── Windows desktop client (separate job for SignPath code signing) ───────────
  release-desktop-windows:
    name: Build and sign desktop client (Windows)
    runs-on: windows-latest
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Stamp version in tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.VERSION.replace(/^v/, '');
            const ver = raw.split('.').slice(0, 3).join('.');
            const tp = 'frontend/src-tauri/tauri.conf.json';
            const tc = JSON.parse(fs.readFileSync(tp, 'utf8'));
            tc.version = ver;
            fs.writeFileSync(tp, JSON.stringify(tc, null, 2) + '\n');
            const cp = 'frontend/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cp, 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"' + ver + '\"');
            fs.writeFileSync(cp, cargo);
          "
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build desktop app (Windows)
        run: cd frontend && npm run tauri:build -- --bundles nsis

      - name: Collect unsigned artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "WarmDesk-${{ github.ref_name }}-x64-setup.exe"
          Compress-Archive -Path "frontend/src-tauri/target/release/WarmDesk.exe" -DestinationPath "WarmDesk-${{ github.ref_name }}-x64-portable.zip"

      - name: Sign artifacts (Windows)
        if: env.HAS_GPG == 'true'
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          for f in "WarmDesk-${{ github.ref_name }}-x64-setup.exe" \
                   "WarmDesk-${{ github.ref_name }}-x64-portable.zip"; do
            gpg --batch --yes --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      # Authenticode signing temporarily disabled
      # - name: Upload unsigned installer for signing
      #   id: upload-unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: warmdesk-unsigned-installer
      #     path: WarmDesk-${{ github.ref_name }}-x64-setup.exe
      #     if-no-files-found: error

      # - name: Sign installer via SignPath
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
      #     project-slug: 'warmdesk'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     wait-for-completion-timeout-in-seconds: 1200
      #     output-artifact-directory: signed

      # - name: Rename signed installer
      #   shell: pwsh
      #   run: |
      #     Copy-Item (Get-ChildItem signed/*.exe | Select-Object -First 1).FullName "WarmDesk-${{ github.ref_name }}-x64-setup.exe"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            WarmDesk-${{ github.ref_name }}-x64-setup.exe
            WarmDesk-${{ github.ref_name }}-x64-setup.exe.asc
            WarmDesk-${{ github.ref_name }}-x64-portable.zip
            WarmDesk-${{ github.ref_name }}-x64-portable.zip.asc

  # ── Publish release after all assets are uploaded ───────────────────────────
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release-server, release-desktop, release-desktop-windows]

    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
