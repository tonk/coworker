<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1D9E75"/>

  <!-- Cup rim -->
  <rect x="10" y="4" width="12" height="3" rx="1.5" fill="#0F6E56"/>

  <!-- Cup body -->
  <rect x="11" y="7" width="10" height="8" rx="2" fill="#5DCAA5"/>

  <!-- Cup handle -->
  <path d="M 21 9.5 q 3,0 3,2.5 0,2.5 -3,2.5" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Desk top -->
  <rect x="2" y="17" width="28" height="3" rx="2" fill="#9FE1CB"/>

  <!-- Desk body -->
  <rect x="4" y="20" width="24" height="3" rx="2" fill="#5DCAA5"/>

  <!-- Desk legs -->
  <rect x="7"  y="23" width="3" height="7" rx="1" fill="#0F6E56"/>
  <rect x="22" y="23" width="3" height="7" rx="1" fill="#0F6E56"/>
</svg>
