<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="462"
   height="172.845"
   viewBox="0 0 462 172.845"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .desk-top   { fill: #FFE0A3; }
      .desk-body  { fill: #F5A93F; }
      .desk-leg   { fill: #C97A1D; }
      .clock-rim  { fill: #8A5010; }
      .clock-face { fill: #C97A1D; }
      .clock-hand { stroke: #FFE0A3; fill: none; }
      .clock-dot  { fill: #FFE0A3; }
      .wordmark-time     { fill: #FFE0A3; }
      .wordmark-tracking { fill: #ffd18a; }
      .tagline           { fill: #B4B2A9; }
      .ribbon { fill: #8A5010; }
      .ribbon-text { fill: #FFFFFF; font-family: FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Desk legs -->
  <rect class="desk-leg" x="26"  y="108.5" width="13" height="62" rx="3"/>
  <rect class="desk-leg" x="145" y="108.5" width="13" height="62" rx="3"/>

  <!-- Desk apron -->
  <rect class="desk-body" x="10" y="90.5" width="162" height="24" rx="5"/>

  <!-- Desk top surface -->
  <rect class="desk-top" x="0" y="78.5" width="182" height="16" rx="4"/>

  <!-- Clock (drawn after desk so it sits on the surface) -->
  <!-- Outer rim -->
  <circle class="clock-rim"  cx="91" cy="50" r="32"/>
  <!-- Face -->
  <circle class="clock-face" cx="91" cy="50" r="26"/>
  <!-- Hour hand — pointing to 10 o'clock (−60° from 12, length 14) -->
  <line  class="clock-hand"  x1="91" y1="50" x2="79" y2="43"
         stroke-width="4.5" stroke-linecap="round"/>
  <!-- Minute hand — pointing to 2 (10 minutes = +60° from 12, length 20) -->
  <line  class="clock-hand"  x1="91" y1="50" x2="108" y2="40"
         stroke-width="3.5" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle class="clock-dot" cx="91" cy="50" r="3.5"/>

  <!-- Wordmark -->
  <text
     x="202"
     y="91.5"
     font-family="FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif"
     font-size="64px"
     font-weight="500"
     class="wordmark-time"
     letter-spacing="-1">Time</text>
  <text
     x="202"
     y="146.5"
     font-family="FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif"
     font-size="56px"
     font-weight="500"
     class="wordmark-tracking"
     letter-spacing="-1">Tracking</text>

  <!-- Tagline -->
  <text
     x="204"
     y="172"
     font-family="FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif"
     font-size="15px"
     font-weight="400"
     class="tagline"
     letter-spacing="2">test instance</text>

  <!-- TEST corner ribbon -->
  <g transform="translate(390,22) rotate(28)">
    <rect class="ribbon" x="-100" y="-14" width="200" height="28" rx="3"/>
    <text class="ribbon-text" x="0" y="6" text-anchor="middle">TEST</text>
  </g>
</svg>
