<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="160"
   height="156.5"
   viewBox="0 0 160 156.5"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .desk-top { fill: #FFE0A3; }
      .desk-body { fill: #F5A93F; }
      .desk-leg { fill: #C97A1D; }
      .steam { stroke: #FFE0A3; }
      .cup-body { fill: #C97A1D; }
      .cup-rim { fill: #8A5010; }
      .cup-handle { stroke: #FFE0A3; }
      .ribbon { fill: #8A5010; }
      .ribbon-text { fill: #FFFFFF; font-family: FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- Desk legs -->
  <rect class="desk-leg" x="24" y="104.5" width="11" height="52" rx="3"/>
  <rect class="desk-leg" x="125" y="104.5" width="11" height="52" rx="3"/>
  <!-- Desk surface -->
  <rect class="desk-body" x="10" y="88.5" width="140" height="20" rx="5"/>
  <rect class="desk-top" x="0" y="76.5" width="160" height="16" rx="4"/>
  <!-- Cup body -->
  <rect class="cup-body" x="54" y="40.5" width="52" height="40" rx="5"/>
  <!-- Cup rim -->
  <rect class="cup-rim" x="48" y="34.5" width="64" height="10" rx="4"/>
  <!-- Cup handle -->
  <path d="m 106,50.5 q 20,0 20,10 0,10 -20,10" fill="none" class="cup-handle" stroke-width="5" stroke-linecap="round"/>
  <!-- Steam -->
  <path class="steam" d="m 66,30.5 q -4,-12 0,-24" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path class="steam" d="m 80,27.5 q -4,-13 0,-26" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path class="steam" d="m 94,30.5 q -4,-12 0,-24" fill="none" stroke-width="3" stroke-linecap="round"/>
  <!-- TEST corner ribbon -->
  <g transform="translate(135,25) rotate(40)">
    <rect class="ribbon" x="-70" y="-13" width="140" height="26" rx="3"/>
    <text class="ribbon-text" x="0" y="5" text-anchor="middle">TEST</text>
  </g>
</svg>
