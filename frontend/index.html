<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarmDesk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Install a fetch proxy BEFORE the ES module bundle is evaluated.
      Axios's fetch adapter captures window.fetch at module-load time via a
      default parameter, so we cannot patch it from inside main.js.
      The proxy delegates to window.__tauriFetch (set by main.js on Windows)
      once it is available, and falls back to the native fetch otherwise.
    -->
    <script>
      ;(function () {
        var _native = window.fetch.bind(window)
        window.fetch = async function warmDeskFetch (input, init) {
          // Only route actual HTTP/HTTPS requests through tauri-plugin-http.
          // Requests to tauri:// or other schemes (internal WebKit resource
          // loads) must use the native fetch or WebKit will hang/blank.
          if (window.__tauriFetch) {
            var url = typeof input === 'string'
              ? input
              : (input && input.url) ? input.url : String(input)
            if (url.startsWith('http://') || url.startsWith('https://')) {
              // tauri-plugin-http expects (url, init). Some libraries (Axios
              // fetch adapter) pass a Request object, which we normalize here.
              if (input instanceof Request) {
                var req = input
                var normalizedInit = Object.assign({
                  method: req.method,
                  headers: Object.fromEntries(req.headers.entries()),
                }, init || {})
                if (
                  normalizedInit.body == null &&
                  req.method !== 'GET' &&
                  req.method !== 'HEAD'
                ) {
                  try {
                    normalizedInit.body = await req.clone().text()
                  } catch (_) {}
                }
                return window.__tauriFetch(req.url, normalizedInit)
              }
              return window.__tauriFetch(url, init)
            }
          }
          return _native(input, init)
        }
      })()
    </script>
    <!-- DEBUG: boot timer — shows elapsed time from when the HTML is first
         parsed by WebView2.  If the timer appears *after* the 33-second blank
         screen, the delay is in WebView2 loading the page (not in JavaScript).
         If the timer ticks throughout the blank screen, the delay is in main.js.
         Remove this block once the root cause is identified. -->
    <style>#wd-bt{position:fixed;top:4px;right:4px;padding:3px 9px;border-radius:3px;background:rgba(0,0,0,.6);color:#e2e8f0;font:11px/1.6 monospace;z-index:99999;pointer-events:none}</style>
    <div id="wd-bt">⏱ 0.0s</div>
    <script>
      !function(){
        var t=Date.now()
        var e=document.getElementById('wd-bt')
        var i=setInterval(function(){if(e)e.textContent='⏱ '+((Date.now()-t)/1e3).toFixed(1)+'s'},100)
        window.__wdBootDone=function(){clearInterval(i);if(e)e.remove()}
        console.log('[warmdesk-boot] HTML parsed — t=0ms baseline')
      }()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
