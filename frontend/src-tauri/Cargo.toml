[package]
name = "warmdesk"
version = "0.12.30"
edition = "2021"

[lib]
name = "warmdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "charset", "macos-system-configuration", "cookies"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_16"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Needed to access ICoreWebView2Settings2 directly and disable autofill IPC.
# The crate is already a transitive dep via tauri; pin to the same version.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
