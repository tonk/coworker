[package]
name = "warmdesk"
version = "0.12.39"
edition = "2021"

[lib]
name = "warmdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_16"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "charset", "macos-system-configuration", "cookies"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Needed to access ICoreWebView2Settings2 directly and disable autofill IPC.
# The crate is already a transitive dep via tauri; pin to the same version.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
# native-tls (schannel on Windows) instead of rustls-tls: some servers request
# mid-handshake TLS renegotiation, which rustls deliberately does not support
# (a legacy, security-sensitive TLS feature it refuses to implement by design).
# schannel handles it transparently — confirmed via curl.exe (which also uses
# schannel on Windows) succeeding against a server where tauri-plugin-http's
# rustls-tls-based requests got rejected.
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls", "charset", "macos-system-configuration", "cookies"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# Vendor patch: change tray-icon GTK icon description from "icon"/"tray icon"
# to "WarmDesk" so the system tray hover never shows "warmdesk icon".
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
