<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.author }}">

{{- $desc := .Description | default site.Params.description }}
{{- $ogTitle := cond .IsHome site.Title .Title }}
{{- $ogImagePath := site.Params.og_image | default "images/logo-full.svg" }}
{{- $ogImage := $ogImagePath | absURL }}

<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ $ogTitle }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:image" content="{{ $ogImage }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $ogTitle }}">
<meta name="twitter:description" content="{{ $desc }}">
<meta name="twitter:image" content="{{ $ogImage }}">

<link rel="stylesheet" href="{{ "css/vendor/highlight-github-dark.min.css" | absURL }}">
<script src="{{ "js/vendor/highlight.min.js" | absURL }}" defer></script>
<script>document.addEventListener('DOMContentLoaded', function(){ if(window.hljs) hljs.highlightAll(); });</script>

<script>(function(){var t=localStorage.getItem('wd-theme')||'system';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
<link rel="icon" type="image/svg+xml" href="{{ "images/logo-full.svg" | absURL }}">
