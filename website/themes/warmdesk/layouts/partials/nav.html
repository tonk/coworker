<nav class="navbar" role="navigation" aria-label="main navigation">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ "" | absURL }}">
      <img src="{{ "images/logo-full.svg" | absURL }}" alt="WarmDesk" onerror="this.style.display='none'">
      <span>WarmDesk</span>
    </a>

    <button type="button" class="navbar-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="navbar-nav">
      {{- range site.Menus.main }}
        {{- $external := .Params.external | default false }}
        {{- $icon := .Params.icon | default "" }}
        {{- if eq $icon "github" }}
          <li class="nav-cta">
            <a href="{{ .URL }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}>
              🐙 GitHub
            </a>
          </li>
        {{- else }}
          <li>
            <a href="{{ .URL }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}>
              {{- .Name -}}
            </a>
          </li>
        {{- end }}
      {{- end }}
    </ul>
    <div class="theme-switcher" id="themeSwitcher">
      <button class="theme-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
        <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><polyline points="8 21 12 17 16 21"/></svg>
      </button>
      <div class="theme-dropdown" id="themeDropdown" hidden>
        <button class="theme-option" data-theme-val="light">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Light
        </button>
        <button class="theme-option" data-theme-val="dark">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Dark
        </button>
        <button class="theme-option" data-theme-val="system">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><polyline points="8 21 12 17 16 21"/></svg>
          System
        </button>
      </div>
    </div>
  </div>
</nav>
