baseURL = "https://tonk.github.io/warmdesk/"
languageCode = "en-us"
title = "WarmDesk"
theme = "warmdesk"
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Self-hosted project management for modern teams"
  author = "Ton Kersten"
  github = "https://github.com/tonk/warmdesk"
  email = "tonk@smartowl.nl"
  tagline = "Own Your Workflow"
  subtitle = "A single Go binary covering Kanban boards, Scrum sprints, team chat with one-to-one voice & video calls, helpdesk ticketing with SLA, customer management, time tracking, and Git integration — owned and operated by you."
  # Social preview image (absolute URL built via absURL). Prefer ≥1200×630 PNG/JPEG for best crawler support.
  og_image = "images/logo-full.svg"
  # Release info — update both this and warmdesk-version in [markup.asciidocext.attributes] on each release
  warmdesk_version = "v0.10.33"
  release_date     = "2026-05-29"
  # Release highlights shown in the "What's new" strip on the homepage (2-3 bullets)
  release_highlights = [
    "**Time tracking Grid PDF** — new landscape A4 export in week, month, and year views; holiday cells amber-tinted, month weekends light gray.",
    "**Dutch 'Zonder klant'** — corrected 'no customer' translation across all contexts.",
    "**Grid PDF fixes** — year header overlap, month label, column offset, and dropdown direction all corrected.",
  ]

[markup]
  [markup.asciidocext]
    backend = "html5"
    extensions = []
    failureLevel = "fatal"
    noHeaderOrFooter = true
    preserveTOC = false
    safeMode = "unsafe"
    sectionNumbers = false
    trace = false
    verbose = false
    workingFolderCurrent = false
    [markup.asciidocext.attributes]
      "source-highlighter" = "highlight.js"
      "sectanchors" = ""
      "sectlinks" = ""
      "warmdesk-version" = "v0.10.33"

  # Chroma off — fenced Markdown code stays plain <pre><code>; AsciiDoc uses hljs (see theme head).
  [markup.highlight]
    codeFences = false

[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^tailwindcss$', '^asciidoctor$']

[[menus.main]]
  name = "Features"
  url = "/#features"
  weight = 10

[[menus.main]]
  name = "Screenshots"
  url = "/#screenshots"
  weight = 20

[[menus.main]]
  name = "Docs"
  url = "/docs/"
  weight = 30

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 40

[[menus.main]]
  name = "Download"
  url = "/download/"
  weight = 45

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/tonk/warmdesk"
  weight = 50
  [menus.main.params]
    external = true
    icon = "github"
