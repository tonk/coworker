# Apache configuration for WarmDesk
# Requires modules: proxy, proxy_http, proxy_wstunnel, ssl, headers, rewrite
# Enable with: sudo a2enmod proxy proxy_http proxy_wstunnel ssl headers rewrite
#
# Place this file in /etc/apache2/sites-available/warmdesk.conf
# then: sudo a2ensite warmdesk && sudo systemctl reload apache2
#
# When the proxy runs on the same host as WarmDesk, set in warmdesk.yaml:
#   trusted_proxies: "127.0.0.1"
# so auth logs and rate limiting use the real client IP from X-Forwarded-For.
#
# X-Forwarded-Proto (set below) is required for httpOnly auth and MFA-trust
# cookies: WarmDesk marks them Secure only when the request is HTTPS (direct
# TLS or X-Forwarded-Proto: https). Without this header, browsers behind
# TLS-terminated Apache would not persist login cookies.

<VirtualHost *:80>
    ServerName yourdomain.com

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName yourdomain.com

    # SSL — obtain a certificate with: certbot --apache -d yourdomain.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # Security headers
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    # Tune the CSP to match your setup:
    #   unsafe-inline  — required by the Vite bundle (inline event handlers / style blocks)
    #   unsafe-eval    — required by vue-i18n's runtime message compiler (new Function())
    #   api.github.com — required by the in-app update checker
    # If you serve avatars or attachments from a CDN, add its origin to img-src.
    Header always set Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://api.github.com; frame-ancestors 'none'"

    ProxyPreserveHost On
    # 24 h — keeps board/chat/video-call WebSocket sessions alive (matches nginx).
    ProxyTimeout 86400

    # WebSocket — longest prefix first. Requires mod_proxy_wstunnel.
    ProxyPass        /api/v1/ws ws://127.0.0.1:8080/api/v1/ws
    ProxyPassReverse /api/v1/ws ws://127.0.0.1:8080/api/v1/ws

    # All other traffic
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Forward client IP to the backend
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog  ${APACHE_LOG_DIR}/warmdesk-error.log
    CustomLog ${APACHE_LOG_DIR}/warmdesk-access.log combined
</VirtualHost>
