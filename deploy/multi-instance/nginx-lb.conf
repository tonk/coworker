# Nginx load balancer configuration for a 3-instance WarmDesk deployment.
# This is the single-instance ../nginx.conf template extended with an
# `upstream` block fanning out to warmdesk-1/2/3. Place this file in
# /etc/nginx/sites-available/warmdesk on the load-balancer host, then:
#   sudo ln -s /etc/nginx/sites-available/warmdesk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set in every instance's warmdesk.yaml:
#   trusted_proxies: "<this load balancer's address>"
# so auth logs and rate limiting use the real client IP from X-Forwarded-For.
#
# No session affinity ("sticky sessions") is required: each instance's
# WebSocket connections are relayed to the others via Redis pub/sub
# (redis_url in warmdesk.yaml), so it doesn't matter which instance a given
# browser tab lands on — round-robin is fine.
#
# Known gap: the login/register/password-reset rate limiter (10 req/15 min)
# is per-instance in-memory, not Redis-backed. Round-robining across 3
# instances means a brute-force attempt effectively gets ~3x the budget
# before any single instance's limiter kicks in. Acceptable for an internal
# team; worth revisiting before exposing this to the open internet at scale.

upstream warmdesk_backend {
    # Add or remove `server` lines to match your actual instance count/addresses.
    server warmdesk-1.internal:8080;
    server warmdesk-2.internal:8080;
    server warmdesk-3.internal:8080;

    # No health-check directive here — that's an nginx-plus feature. Nginx OSS
    # will mark a backend down after `max_fails` failed attempts within
    # `fail_timeout` and skip it for that window. WarmDesk has no dedicated
    # /health endpoint at the time of writing; using `/` here is a plain
    # unauthenticated GET and adequate as a liveness signal, but confirm your
    # nginx version's `server` directive supports the health-check flags you
    # rely on, or manage instance draining manually during maintenance.
}

server {
    listen 80;
    server_name desk.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name desk.example.com;

    # SSL — obtain a certificate with: certbot --nginx -d desk.example.com
    ssl_certificate     /etc/letsencrypt/live/desk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options     "nosniff"                            always;
    add_header Referrer-Policy            "strict-origin"                      always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    # Tune the CSP to match your setup — see ../nginx.conf for notes on each directive.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://api.github.com; frame-ancestors 'none'" always;

    # nginx defaults to 1m; WarmDesk's default max_upload_mb is 25.
    client_max_body_size 25m;

    # WebSocket endpoints — Upgrade and Connection are hardcoded to "websocket" so
    # HTTP/2 RFC-8441 extended CONNECT works correctly ($http_upgrade is empty for HTTP/2).
    # Only websocket upgrades are allowed; h2c upgrades are blocked at this location.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    location ~ ^/api/v1/ws {
        proxy_pass         http://warmdesk_backend;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade   websocket;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All other traffic — no Upgrade header forwarded, preventing h2c smuggling.
    location / {
        proxy_pass         http://warmdesk_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
