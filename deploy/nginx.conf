# Nginx configuration for WarmDesk
# Place this file in /etc/nginx/sites-available/warmdesk
# then: sudo ln -s /etc/nginx/sites-available/warmdesk /etc/nginx/sites-enabled/
# and:  sudo nginx -t && sudo systemctl reload nginx
#
# When the proxy runs on the same host as WarmDesk, set in warmdesk.yaml:
#   trusted_proxies: "127.0.0.1"
# so auth logs and rate limiting use the real client IP from X-Forwarded-For.
#
# X-Forwarded-Proto (set below on every location) is required for httpOnly auth
# and MFA-trust cookies: WarmDesk marks them Secure only when the request is
# HTTPS (direct TLS or X-Forwarded-Proto: https). Without this header, browsers
# behind TLS-terminated nginx would not persist login cookies.

server {
    listen 80;
    server_name yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    # SSL — obtain a certificate with: certbot --nginx -d yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options     "nosniff"                            always;
    add_header Referrer-Policy            "strict-origin"                      always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    # Tune the CSP to match your setup:
    #   unsafe-inline  — required by the Vite bundle (inline event handlers / style blocks)
    #   unsafe-eval    — required by vue-i18n's runtime message compiler (new Function())
    #   api.github.com — required by the in-app update checker
    # If you serve avatars or attachments from a CDN, add its origin to img-src.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://api.github.com; frame-ancestors 'none'" always;

    # nginx defaults to 1m; WarmDesk's default max_upload_mb is 25.
    client_max_body_size 25m;

    # WebSocket endpoints — Upgrade and Connection are hardcoded to "websocket" so
    # HTTP/2 RFC-8441 extended CONNECT works correctly ($http_upgrade is empty for HTTP/2).
    # Only websocket upgrades are allowed; h2c upgrades are blocked at this location.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    location ~ ^/api/v1/ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade   websocket;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All other traffic — no Upgrade header forwarded, preventing h2c smuggling.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
